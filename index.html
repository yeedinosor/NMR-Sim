  <script type="py" config="packages=['numpy']">
    from pyscript import web, when, window
    import numpy as np
    @when("click", "#reset-button")
    def reset(event):
        window.speed=float(web.page["speed"].value)
        window.w0=float(web.page["w0"].value)
        window.w1=float(web.page["w1"].value)
        window.rf=False
        window.M=[0,0,1]
        window.t=0
        window.paused=False
    @when("click", "#apply-button")
    def apply(event):
        window.speed=float(web.page["speed"].value)
        window.w0=float(web.page["w0"].value)
        window.w1=float(web.page["w1"].value)
    @when("click", "#pause-button")
    def pause(event):
        window.paused = not window.paused
    @when("click", "#rf-button")
    def toggle_rf(event):
      window.rf = not window.rf
    def B(t):
      Bt=np.array([0.0,0.0,1.0])
      if(window.rf):
        Bt[1]=window.w1*np.cos(window.w0*t)
      return Bt
    def bloch_rhs(t, M, gamma, B, T1, T2, M0):
      Mx, My, Mz = M
      Bx, By, Bz = B
  
      dMx = gamma * (My*Bz - Mz*By) - Mx/T2
      dMy = gamma * (Mz*Bx - Mx*Bz) - My/T2
      dMz = gamma * (Mx*By - My*Bx) - (Mz - M0)/T1
  
      return np.array([dMx, dMy, dMz])
    
    def rk4_step(t, M, h, gamma, T1, T2, M0):
      k1 = bloch_rhs(t,       M,           gamma, B(t), T1, T2, M0)
      k2 = bloch_rhs(t+h/2,   M+h*k1/2,    gamma, B(t+ h/2), T1, T2, M0)
      k3 = bloch_rhs(t+h/2,   M+h*k2/2,    gamma, B(t+ h/2), T1, T2, M0)
      k4 = bloch_rhs(t+h,     M+h*k3,      gamma, B(t+ h), T1, T2, M0)
  
      return M + h*(k1 + 2*k2 + 2*k3 + k4)/6

    def update(t, dt):
      M=np.array([window.M[0],window.M[1],window.M[2]])
      print(M, dt)
      M = rk4_step(t, M, dt, window.w0, 100, 100, 1)
      Mx, My, Mz = M
      window.M[0]=Mx
      window.M[1]=My
      window.M[2]=Mz
      return t
      
    window.updatePython = update

  </script>

  <script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=b56436eae3c64b98b41ab79835663f46"></script>

    var elt = document.getElementById('calculator3d');

    window.addEventListener("updated", () => {
      console.log(window.l)
      calculator3d.setExpression({ id: 'parabola', latex: window.l });
    });
    let lastTime = performance.now();
    async function animate(time) {
    
      if (!window.paused&&window.updatePython) {
        // const t = time/1000;
        // const dt = Math.min(0.1, (time - lastTime)/1000);
        // lastTime = time;
        let M_prev=[window.M[0], window.M[1], window.M[2]]
        const result = await window.updatePython(window.t, window.speed*0.0335);
        calculator3d.setExpression({ id: 'x', latex: "X="+window.M[0] });
        calculator3d.setExpression({ id: 'y', latex: "Y="+window.M[1] });
        calculator3d.setExpression({ id: 'z', latex: "Z="+window.M[2] });
        calculator3d.setExpression({latex:'\\operatorname{segment}\\left(('+M_prev[0]+','+M_prev[1]+','+M_prev[2]+'),('+window.M[0]+','+window.M[1]+','+window.M[2]+')\\right)', color: '#aaaaaa'})
        calculator3d.setExpression({ id: 't', latex: "T="+window.t });
        window.t+=window.speed*0.0335;
      }
      
      requestAnimationFrame(animate);
  }
  window.animationSatrted=false;
  function start() {
    calculator3d.setBlank();
    calculator3d.setState({
        "version": 11,
